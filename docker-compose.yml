version: '3.9'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:18-alpine
    container_name: graduation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gb_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graduation_network

  # ASP.NET Core Web API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graduation_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ASP.NET Core Configuration
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5132
      
      # Database Connection String
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-gb_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-1234};Include Error Detail=true"
      
      # Optional: CORS settings if needed
      AllowedHosts: "*"
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - graduation_network
    volumes:
      # Optional: Mount appsettings for quick config changes without rebuild
      - ./appsettings.Development.json:/app/appsettings.Development.json:ro

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local

# Custom network
networks:
  graduation_network:
    driver: bridge